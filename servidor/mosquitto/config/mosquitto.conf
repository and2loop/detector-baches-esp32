# Guardar en disco los mensajes pendientes (sesiones persistentes)
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Nadie entra sin usuario y contraseña
allow_anonymous false
password_file /mosquitto/config/passwd

# Puerto sin cifrar. En esta fase se abre a internet SOLO para probar;
# en la Fase 5 quedará solo para Node-RED (dentro de Docker)
listener 1883
